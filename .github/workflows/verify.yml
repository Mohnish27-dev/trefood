# ══════════════════════════════════════════════════════════════════════
#  Reusable gate: typecheck, lint, test.
#
#  Defined once and called by both ci.yml (pull requests) and deploy.yml
#  (pushes to main), so "green" means exactly the same thing in both. A
#  deploy that skipped a check the PR ran is how a broken main happens.
# ══════════════════════════════════════════════════════════════════════
name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # tests/integration/* talk to a real database — vitest.config.mts loads
    # .env.local so they hit the same Mongo the dev server does. There is no
    # .env.local on a runner, so CI supplies a throwaway Mongo instead of
    # letting those tests fail for want of a MONGODB_URI.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      # No credentials: the CI Mongo runs without auth and is destroyed with
      # the job. A separate database name keeps it obvious in any stray log
      # that this is not production data.
      MONGODB_URI: mongodb://127.0.0.1:27017/trefood_ci
      MONGODB_DB: trefood_ci
      AUTH_PROVIDER: stub
      PAYMENT_PROVIDER: stub
      CRON_SECRET: ci-only-not-a-real-secret
      # No mailbox on a runner, and nothing here should ever send a real
      # message. `console` prints instead of sending; without it env.ts
      # rightly demands SMTP credentials and the seed step cannot boot.
      # vitest forces the same value, but `npm run seed` is its own process.
      MAIL_TRANSPORT: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Non-blocking, deliberately and temporarily.
        #
        # The repository carries 29 lint errors that all predate this
        # pipeline — lint has never been enforced in CI here. Blocking every
        # deploy on them would be the tail wagging the dog, and the usual
        # response to a gate nobody can pass is to delete the gate.
        #
        # So the errors are still printed in full below, where they stay
        # visible and can be burned down a few at a time. Delete this line
        # the moment the count reaches zero.
        #
        # One of them is worth reading: a custom no-restricted-syntax rule
        # firing on Math.round in the Paytm webhook money path. See
        # docs/FAILURES_AND_EDGE_CASES.md.
        continue-on-error: true
        run: npm run lint

      - name: Seed the test database
        # tests/integration/* need the campus (slug "nit-patna") that seed.ts
        # upserts — gates, curfews and pricing defaults all hang off it. The
        # restaurant they order from is built and torn down by
        # canteen-fixture.ts, but the campus is not, so an unseeded database
        # fails them with "Seed missing" and four unhelpful `false !== true`.
        #
        # seed.ts also deletes legacy demo data, which is why it matters that
        # this can only ever hit the throwaway service container above:
        # MONGODB_URI comes from the job env, and there is no .env.local on a
        # runner for vitest.config.mts to load Atlas credentials from.
        run: npm run seed

      - name: Test
        run: npm test
