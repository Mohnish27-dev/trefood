# ══════════════════════════════════════════════════════════════════════
#  CI — runs on every pull request.
#
#  Pushes to main are covered by deploy.yml, which calls the same reusable
#  gate before it builds. Running both here would double the bill for no
#  extra signal.
# ══════════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
