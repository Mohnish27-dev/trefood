name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # @trefood/shared must be built first: backend and frontend both consume its
      # emitted .d.ts files. Each script below builds it too, but doing it once up
      # front keeps the failure legible if the shared package itself is broken.
      - name: Build shared
        run: npm run build -w @trefood/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

# The backend build is not run here: `typecheck` already compiles the same files with
# the same config, so a second tsc pass would add time and no signal. The frontend
# build is not run because it needs real NEXT_PUBLIC_* values to inline.
