name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

# `next build` is deliberately not run here. The build imports src/lib/env.server.ts,
# which refuses to start without real secrets — and putting real secrets in CI to make
# a build pass is a worse trade than letting Vercel be the build gate. Vercel builds
# every push with the real environment; CI proves the code is sound.
